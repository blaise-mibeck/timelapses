<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timelapses</title>
<style>
:root{--bg:#14161a;--fg:#e8eaed;--mut:#9aa0a6;--acc:#4da3ff;--line:#3a3f47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 16px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
a{color:var(--acc);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{text-decoration:underline}
.d{color:var(--mut);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
<h1>Timelapses</h1>
<ul>
<li><a href="eerc/">EERC</a><span class="d">2026-10-27 08:30</span></li>
</ul>
</div></body></html>
